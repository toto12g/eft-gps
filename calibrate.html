<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>校正ツール — EFT 測位クライアント</title>
<style>
:root {
  --bg: #0e1112; --panel: #16191b; --panel-2: #1c2123; --rule: #2a3133;
  --ink: #dce1df; --ink-2: #aab3b1; --muted: #8b9694;
  --accent: #c79a4e; --ok: #7fa877; --warn: #c9776c;
  --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
  --sans: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 13px/1.7 var(--sans);
       display: grid; grid-template-columns: 340px 1fr; overflow: hidden; }

#side { background: var(--panel); border-right: 1px solid var(--rule);
        display: flex; flex-direction: column; overflow: hidden; }
#side > .box { padding: 12px 14px; border-bottom: 1px solid var(--rule); flex: none; }
h1 { margin: 0; font-size: 14px; font-weight: 600; }
h1 small { display: block; font: 400 10px/1.5 var(--mono); color: var(--muted);
           letter-spacing: .08em; text-transform: uppercase; margin-top: 3px; }
label { display: block; font: 600 10px/1.6 var(--mono); letter-spacing: .1em;
        text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
select, button, textarea { font: 12px/1.5 var(--mono); color: var(--ink);
  background: var(--panel-2); border: 1px solid var(--rule); border-radius: 2px;
  padding: 6px 8px; width: 100%; }
button { cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.field + .field { margin-top: 10px; }
.btn-row { display: flex; gap: 8px; margin-top: 8px; }

#refs { flex: 1; overflow-y: auto; padding: 6px 8px; }
.ref { display: grid; grid-template-columns: 1fr auto 52px; gap: 8px; align-items: baseline;
       width: 100%; text-align: left; background: transparent; border: 0; border-bottom: 1px solid var(--rule);
       padding: 5px 6px; border-radius: 0; }
.ref:hover { background: var(--panel-2); }
.ref.sel { background: #2a2216; border-left: 2px solid var(--accent); padding-left: 4px; }
.ref.set .st { color: var(--ok); }
.ref .nm { font: 12px/1.4 var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ref .co { font: 10px/1.4 var(--mono); color: var(--muted); }
.ref .st { font: 10px/1.4 var(--mono); color: var(--muted); text-align: right; }

.status { font: 12px/1.5 var(--mono); padding: 7px 9px; border-radius: 2px;
          border-left: 3px solid var(--muted); background: var(--panel-2); }
.status.ok { border-left-color: var(--ok); color: var(--ok); }
.status.low { border-left-color: var(--accent); color: var(--accent); }
.status.warn { border-left-color: var(--warn); color: var(--warn); }
.mono { font: 11px/1.7 var(--mono); color: var(--ink-2); margin-top: 6px; }
.hint { font-size: 11px; color: var(--muted); line-height: 1.7; }
#hint { margin-top: 6px; }
#json { margin-top: 8px; height: 120px; font-size: 10px; }
label.check { display: flex; gap: 7px; align-items: center; margin-top: 8px;
              font: 400 11px/1.5 var(--sans); letter-spacing: 0; text-transform: none;
              color: var(--ink-2); cursor: pointer; }
label.check input { width: auto; accent-color: var(--accent); }

#stage { position: relative; overflow: hidden; background: #0a0c0d;
         cursor: crosshair; touch-action: none; }
#canvas { position: absolute; left: 0; top: 0; }
#svg-host { position: absolute; inset: 0; }
#svg-host svg { width: 100%; height: 100%; }
#overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
</style>
</head>
<body>

<div id="side">
  <div class="box">
    <h1>校正ツール<small>world → svg affine</small></h1>
  </div>

  <div class="box">
    <div class="field">
      <label for="map-select">マップ</label>
      <select id="map-select"></select>
    </div>
    <div class="field">
      <label for="svg-select">地図画像（maps/）</label>
      <select id="svg-select"><option value="">—</option></select>
    </div>
    <div class="btn-row">
      <button type="button" id="btn-seed">初期値から出発</button>
      <button type="button" id="btn-reset">点を全消去</button>
    </div>
    <div class="btn-row">
      <button type="button" id="btn-fitview">全体表示</button>
    </div>
    <label class="check"><input type="checkbox" id="show-poi" checked><span>POI 点群を重ねる</span></label>
    <div class="hint" id="hint"></div>
  </div>

  <div class="box">
    <label>参照点（クリックで選び、地図上をクリックして対応づけ）</label>
  </div>
  <div id="refs"></div>

  <div class="box">
    <div id="result"></div>
    <div class="btn-row">
      <button type="button" id="btn-copy" disabled>JSON をコピー</button>
    </div>
    <textarea id="json" hidden spellcheck="false"></textarea>
    <p class="hint" style="margin:8px 0 0">
      コピーした内容を <code>data/calib-overrides.json</code> に貼って
      <code>py tools/build_data.py</code> を実行すると反映されます。
    </p>
  </div>
</div>

<div id="stage">
  <div id="canvas">
    <div id="svg-host"></div>
    <svg id="overlay" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
</div>

<script type="module" src="./src/app/calibrate.js"></script>
</body>
</html>
